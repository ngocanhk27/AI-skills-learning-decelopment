name: Topic request
description: Propose a new topic to learn and document
title: "[Topic] "
labels: [topic]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "Learn: Fundamentals"
        - "Learn: LLM Models"
        - "Learn: RAG & Knowledge"
        - "Learn: Multimodal"
        - "Tools: Harness Systems"
        - "Tools: Skills"
        - "Tools: MCP"
        - "Tools: Connectors"
        - "Tools: AI Products & Apps"
        - "Build: Building with LLM APIs"
        - "Build: Evaluation & Observability"
        - "Build: Security & Governance"
        - "Build: Customization"
        - "Apply: Automation"
        - "Apply: Playbooks"
        - "Apply: Use Cases by Role"
        - "Apply: Labs"
        - "Stay Current: AI Radar"
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Topic title
      placeholder: e.g. Building an MCP server
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why learn this?
      description: What would you be able to do once you've learned it?
  - type: dropdown
    id: level
    attributes:
      label: Level
      options: [beginner, intermediate, advanced]
  - type: textarea
    id: links
    attributes:
      label: Starting links
      description: Official docs, articles or videos to start from.
